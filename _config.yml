title: Yuxing Huang
name: Yuxing Huang
description: "Yuxing Huang — Ph.D. student at New York University. Research in stochastic control and backward stochastic differential equations (BSDEs), with applications to economics and finance."
url: https://yuxingmath.github.io
baseurl: ""
repository: YuxingMath/yuxingmath.github.io
locale: en-US
timezone: America/New_York

author:
  name: Yuxing Huang
  chinese_name: 黄宇星
  bio: Ph.D. Student in Mathematical Finance
  employer: New York University
  avatar: /images/yuxing-portrait.jpg
  email: yh6004@nyu.edu
  googlescholar: https://scholar.google.com/citations?user=cfIO29cAAAAJ&hl=en
  cv: /assets/pdf/CV_yuxing.pdf

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
include:
  - _pages
# Retain legacy template files as source, but do not publish demo content.
exclude:
  - README.md
  - CONTRIBUTING.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - Dockerfile
  - docker-compose.yaml
  - _config_docker.yml
  - package.json
  - package-lock.json
  - node_modules
  - vendor
  - scripts
  - markdown_generator
  - files
  - talkmap
  - talkmap.py
  - talkmap.ipynb
  - talkmap_out.ipynb
  - _portfolio
  - _drafts
  - _pages/archive-layout-with-content.md
  - _pages/category-archive.html
  - _pages/collection-archive.html
  - _pages/cv-json.md
  - _pages/markdown.md
  - _pages/non-menu-page.md
  - _pages/page-archive.html
  - _pages/portfolio.html
  - _pages/sitemap.md
  - _pages/tag-archive.html
  - _pages/talkmap.html
  - _pages/talks.html
  - _pages/terms.md
  - _pages/year-archive.html
collections:
  publications:
    output: true
    permalink: /:collection/:path/
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: academic
  - scope:
      path: ""
      type: publications
    values:
      layout: publication
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
