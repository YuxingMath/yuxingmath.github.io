<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.url != '/' %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ site.title | escape }}">
    <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ site.author.avatar | absolute_url }}">
    <meta name="theme-color" content="#f5f0fa">
    {% if page.sitemap == false %}<meta name="robots" content="noindex">{% endif %}
    <link rel="icon" type="image/svg+xml" href="{{ '/images/monogram.svg' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/academic.css' | relative_url }}">
  </head>
  <body id="top">
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="site-shell">
      <aside class="profile" aria-label="Profile">
        <img class="profile-photo" src="{{ site.author.avatar | relative_url }}" alt="Portrait of Yuxing Huang" width="941" height="1176" fetchpriority="high">
        <div class="profile-identity">
          <h1 class="profile-name">Yuxing Huang</h1>
          <p class="profile-chinese" lang="zh">黄宇星</p>
          <div class="profile-links">
            <a class="profile-email" href="mailto:{{ site.author.email }}">{{ site.author.email }}</a>
            <a href="{{ site.author.googlescholar | escape }}">Google Scholar</a>
            <a href="{{ site.author.cv | relative_url }}" type="application/pdf">Curriculum vitae</a>
          </div>
        </div>
      </aside>
      <main id="main" class="main-content" tabindex="-1">
        {% if page.url == '/404.html' %}<h2>{{ page.title }}</h2>{% endif %}
        {{ content }}
      </main>
    </div>
  </body>
</html>
